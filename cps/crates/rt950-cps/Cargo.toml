[package]
name = "rt950-cps"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "RT-950 / RT-950 Pro CPS — egui/eframe UI (Maxx Steele style)"
repository.workspace = true

[[bin]]
name = "rt950-cps"
path = "src/main.rs"

[dependencies]
rt950-protocol = { workspace = true }
eframe = { version = "0.34.3", features = ["default_fonts", "glow", "persistence"] }
egui = "0.34.3"
serde = { workspace = true }
serde_json = { workspace = true }
rfd = "0.15"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
